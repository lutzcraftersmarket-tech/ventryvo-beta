<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You | VENTRYVO</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#172554,#1e3a8a 55%,#0f766e);color:#172033}
    .card{width:min(680px,100%);background:white;border-radius:24px;padding:38px;box-shadow:0 22px 60px rgba(0,0,0,.24);text-align:center}
    .brand{font-size:14px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#1d4ed8}
    h1{font-size:clamp(30px,5vw,46px);line-height:1.05;margin:12px 0 16px}
    p{font-size:17px;line-height:1.65;color:#566074;margin:0 auto 16px}
    .free{display:inline-block;background:#ecfdf3;color:#087443;border-radius:999px;padding:9px 14px;font-weight:800;margin-top:6px}
    a{display:inline-block;margin-top:24px;text-decoration:none;background:#2563eb;color:white;font-weight:800;border-radius:12px;padding:13px 18px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">VENTRYVO</div>
    <h1>Thank you for applying!</h1>
    <p>I’ll review your information and contact selected beta testers with details about access and next steps.</p>
    <p>I appreciate your willingness to help shape VENTRYVO before its full release.</p>
    <span class="free">There is no charge to participate in the beta.</span>
    <br />
    <a href="/">Return to VENTRYVO</a>
  </main>
</body>
</html>
